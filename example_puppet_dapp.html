<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wallet Fuzzer DApp Puppet</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      max-width: 600px;
      width: 100%;
      padding: 40px;
    }

    h1 {
      margin-top: 0;
      color: #333;
      text-align: center;
      font-size: 24px;
    }

    .status-card {
      background: #f5f5f5;
      border-left: 4px solid #667eea;
      padding: 20px;
      margin: 20px 0;
      border-radius: 6px;
      font-family: "Monaco", "Courier New", monospace;
      font-size: 13px;
    }

    .status-card.connected {
      border-left-color: #00cc00;
      background: #f0f9f0;
    }

    .status-card.disconnected {
      border-left-color: #ff6b6b;
      background: #fef0f0;
    }

    .status-card.reconnecting {
      border-left-color: #ffaa00;
      background: #fffaf0;
    }

    .status-label {
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .status-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
    }

    .status-dot.connected {
      background: #00cc00;
      animation: pulse-green 2s infinite;
    }

    .status-dot.disconnected {
      background: #ff6b6b;
    }

    .status-dot.reconnecting {
      background: #ffaa00;
      animation: pulse-orange 1s infinite;
    }

    @keyframes pulse-green {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    @keyframes pulse-orange {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    .info-text {
      margin: 10px 0;
      font-size: 12px;
      color: #666;
    }

    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-primary {
      background: #667eea;
      color: white;
    }

    .btn-primary:hover:not(:disabled) {
      background: #5568d3;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }

    .btn-secondary {
      background: #e8e8e8;
      color: #333;
    }

    .btn-secondary:hover:not(:disabled) {
      background: #d8d8d8;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .log-container {
      background: #1e1e1e;
      color: #00cc00;
      border-radius: 6px;
      padding: 15px;
      font-family: "Monaco", "Courier New", monospace;
      font-size: 11px;
      max-height: 300px;
      overflow-y: auto;
      margin-top: 20px;
      line-height: 1.4;
    }

    .log-line {
      margin: 2px 0;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .log-info { color: #0099ff; }
    .log-success { color: #00cc00; }
    .log-warn { color: #ffaa00; }
    .log-error { color: #ff6b6b; }
    .log-payload { color: #bb86fc; }

    .warning-box {
      background: #fff3cd;
      border: 1px solid #ffc107;
      color: #856404;
      padding: 15px;
      border-radius: 6px;
      font-size: 12px;
      margin-bottom: 20px;
    }

    .warning-box strong {
      display: block;
      margin-bottom: 5px;
    }

    .config-section {
      background: #f9f9f9;
      padding: 15px;
      border-radius: 6px;
      margin-top: 20px;
    }

    .config-label {
      font-weight: 600;
      color: #333;
      margin-bottom: 8px;
      font-size: 12px;
    }

    input[type="text"] {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      box-sizing: border-box;
      font-family: "Monaco", "Courier New", monospace;
      font-size: 12px;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎲 Wallet Fuzzer Puppet</h1>

    <div class="warning-box">
      <strong>⚠️ Testing Only</strong>
      This DApp is configured to automatically forward RPC requests to your wallet.
      Use only with test wallets on testnets.
    </div>

    <!-- Configuration -->
    <div class="config-section">
      <div class="config-label">Fuzzer WebSocket URL:</div>
      <input 
        type="text" 
        id="fuzzerUrl" 
        placeholder="wss://your-ngrok-url.ngrok.app"
        value="wss://your-ngrok-url.ngrok.app"
      >
    </div>

    <!-- Status Card -->
    <div class="status-card connected" id="statusCard">
      <div class="status-label">
        <span class="status-dot connected" id="statusDot"></span>
        <span id="statusText">Connecting...</span>
      </div>
      <div class="info-text">Status: <span id="statusValue">connecting</span></div>
      <div class="info-text">Wallet: <span id="walletValue">checking...</span></div>
      <div class="info-text">Reconnect Attempts: <span id="attemptsValue">0</span></div>
    </div>

    <!-- Control Buttons -->
    <div class="button-group">
      <button class="btn-primary" id="startBtn" onclick="startPuppet()">Start Puppet</button>
      <button class="btn-secondary" id="stopBtn" onclick="stopPuppet()" disabled>Stop Puppet</button>
      <button class="btn-secondary" id="statusBtn" onclick="showDetailedStatus()">Details</button>
    </div>

    <!-- Console Log -->
    <div class="log-container" id="logContainer"></div>
  </div>

  <!-- Load the Wallet Fuzzer Puppet Module -->
  <script src="wallet_fuzzer_puppet.js"></script>

  <script>
    // Global puppet instance
    let puppet = null;
    let logCount = 0;
    const MAX_LOGS = 100;

    /**
     * Initialize and start the puppet
     */
    function startPuppet() {
      const fuzzerUrl = document.getElementById('fuzzerUrl').value.trim();

      if (!fuzzerUrl) {
        alert('Please enter a valid Fuzzer WebSocket URL');
        return;
      }

      if (puppet) {
        puppet.stop();
      }

      // Create new puppet instance
      puppet = new WalletFuzzerPuppet(fuzzerUrl, {
        reconnectInterval: 3000,
        maxReconnectAttempts: -1,
        verbose: true
      });

      // Hook into the puppet's internal logging (for UI display)
      interceptPuppetLogs();

      // Start the puppet
      puppet.start();

      // Update UI
      document.getElementById('startBtn').disabled = true;
      document.getElementById('stopBtn').disabled = false;
      document.getElementById('fuzzerUrl').disabled = true;

      // Status polling
      updateStatusUI();
      setInterval(updateStatusUI, 1000);

      logToUI('INFO', `Puppet started. Connecting to: ${fuzzerUrl}`);
    }

    /**
     * Stop the puppet
     */
    function stopPuppet() {
      if (puppet) {
        puppet.stop();
        puppet = null;
      }

      document.getElementById('startBtn').disabled = false;
      document.getElementById('stopBtn').disabled = true;
      document.getElementById('fuzzerUrl').disabled = false;

      logToUI('INFO', 'Puppet stopped');
    }

    /**
     * Update status UI
     */
    function updateStatusUI() {
      if (!puppet) {
        return;
      }

      const status = puppet.getStatus();
      const detailed = puppet.getDetailedStatus();

      // Update status text and color
      const statusText = {
        'connected': '✓ Connected',
        'disconnected': '✗ Disconnected',
        'reconnecting': '⟳ Reconnecting'
      }[status] || status;

      document.getElementById('statusText').textContent = statusText;
      document.getElementById('statusValue').textContent = status;
      document.getElementById('attemptsValue').textContent = detailed.reconnectAttempts;
      document.getElementById('walletValue').textContent = detailed.walletAvailable ? '✓ Available' : '✗ Not Available';

      // Update card color
      const card = document.getElementById('statusCard');
      card.className = `status-card ${status}`;

      // Update dot
      const dot = document.getElementById('statusDot');
      dot.className = `status-dot ${status}`;
    }

    /**
     * Show detailed status in alert
     */
    function showDetailedStatus() {
      if (!puppet) {
        alert('Puppet not initialized');
        return;
      }

      const detailed = puppet.getDetailedStatus();
      const wsReadyStates = {
        0: 'CONNECTING',
        1: 'OPEN',
        2: 'CLOSING',
        3: 'CLOSED'
      };

      const message = `
Fuzzer Puppet Status:

Status: ${detailed.status}
Fuzzer URL: ${detailed.fuzzerUrl}
Reconnect Attempts: ${detailed.reconnectAttempts}
Max Reconnect Attempts: ${detailed.maxReconnectAttempts === -1 ? 'Infinite' : detailed.maxReconnectAttempts}
Wallet Available: ${detailed.walletAvailable ? 'Yes' : 'No'}
WebSocket State: ${wsReadyStates[detailed.wsReadyState] || 'Unknown'}
      `;

      alert(message);
    }

    /**
     * Intercept puppet logs and display in UI
     */
    function interceptPuppetLogs() {
      const originalLog = console.log;
      
      console.log = function(...args) {
        originalLog.apply(console, args);

        // Check if this is a puppet log
        const message = args[0];
        if (typeof message === 'string' && message.includes('[WalletFuzzerPuppet')) {
          const level = message.match(/\[(INFO|SUCCESS|WARN|ERROR|PAYLOAD)\]/) || ['', 'INFO'];
          const logLevel = level[1];

          // Extract the meaningful part
          const content = args.slice(1).map(arg => {
            if (typeof arg === 'object') {
              return JSON.stringify(arg, null, 2);
            }
            return String(arg);
          }).join(' ');

          logToUI(logLevel, content);
        }
      };
    }

    /**
     * Log message to the UI console
     */
    function logToUI(level, message) {
      const logContainer = document.getElementById('logContainer');
      const logLine = document.createElement('div');
      logLine.className = `log-line log-${level.toLowerCase()}`;

      const timestamp = new Date().toLocaleTimeString();
      const levelStr = `[${level}]`.padEnd(10);

      logLine.textContent = `${timestamp} ${levelStr} ${message}`;
      logContainer.appendChild(logLine);

      // Scroll to bottom
      logContainer.scrollTop = logContainer.scrollHeight;

      // Keep only last N logs
      logCount++;
      if (logCount > MAX_LOGS) {
        const firstLog = logContainer.firstChild;
        if (firstLog) {
          firstLog.remove();
        }
        logCount--;
      }
    }

    /**
     * Initialize on page load
     */
    document.addEventListener('DOMContentLoaded', function() {
      logToUI('INFO', 'Wallet Fuzzer Puppet loaded and ready');
      logToUI('INFO', 'Enter Ngrok URL and click "Start Puppet" to begin');
      
      // Check for wallet
      if (window.ethereum) {
        logToUI('SUCCESS', 'Web3 wallet detected (window.ethereum is available)');
      } else {
        logToUI('WARN', 'No Web3 wallet detected. Install MetaMask or TrustWallet');
      }
    });

    // Expose puppet for debugging
    window.puppet = puppet;
    window.logToUI = logToUI;
  </script>
</body>
</html>
