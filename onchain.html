<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>上链测试 · On-chain Verification</title>
<style>
  :root{
    --bg:#f6f7f9; --surface:#fff; --surface-2:#fbfbfd;
    --line:#e7e9ee; --line-2:#eff1f4;
    --ink:#14161a; --ink-2:#4c5562; --ink-3:#8a93a1;
    --accent:#4f46e5; --accent-soft:#eef0ff;
    --ok:#0f9d6e; --warn:#c2740a; --err:#d33b3b;
    --mono:"SF Mono",ui-monospace,"JetBrains Mono",Consolas,"Liberation Mono",monospace;
    --radius:12px;
    --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.03);
  }
  *{box-sizing:border-box}
  .cols,.panel,.panel-body,.card,.judge,.jbox,.case-head,.note{min-width:0}
  .code{min-width:0;max-width:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:400 14px/1.55 "SF Pro Text",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
       -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  code{font-family:var(--mono)}

  /* ---------- 顶栏 ---------- */
  .topbar{position:sticky;top:0;z-index:30;height:58px;display:flex;align-items:center;gap:18px;padding:0 20px;
          background:rgba(255,255,255,.88);backdrop-filter:saturate(180%) blur(14px);
          border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .brand-mark{width:26px;height:26px;border-radius:8px;flex:0 0 auto;
              background:linear-gradient(135deg,#6366f1,#8b5cf6);
              box-shadow:0 2px 6px rgba(99,102,241,.32);
              display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700}
  .brand-title{font-size:14.5px;font-weight:650;line-height:1.15;letter-spacing:.01em}
  .brand-sub{font-size:10px;color:var(--ink-3);letter-spacing:.09em;text-transform:uppercase}
  .topbar-right{margin-left:auto;display:flex;align-items:center;gap:7px;min-width:0}
  .pill{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:7px;
        background:#f4f5f8;color:var(--ink-3);font-size:11.5px;white-space:nowrap}
  .pill b{color:var(--ink-2);font-weight:600}
  .pill.mode-live{background:#fdf1f0;color:var(--err)}
  .pill.mode-live b{color:var(--err)}
  .dot{width:7px;height:7px;border-radius:50%;background:#ccd2dc;display:inline-block;flex:0 0 auto}
  .dot.on{background:var(--ok);box-shadow:0 0 0 3px rgba(15,157,110,.14)}
  .dot.warn{background:var(--warn);box-shadow:0 0 0 3px rgba(194,116,10,.14)}

  .subbar{height:32px;display:flex;align-items:center;gap:9px;padding:0 22px;
          background:var(--surface);border-bottom:1px solid var(--line-2);
          font-size:11.5px;color:var(--ink-3);overflow:hidden;white-space:nowrap}

  /* ---------- 布局 ---------- */
  .app{display:grid;grid-template-columns:272px minmax(0,1fr);align-items:start}
  aside{position:sticky;top:90px;max-height:calc(100vh - 106px);overflow:auto;
        padding:14px 12px 20px;border-right:1px solid var(--line);background:var(--surface-2)}
  .side-label{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
              color:#a3abb8;margin:2px 8px 9px}
  .side-note{margin:20px 8px 0;font-size:11px;line-height:1.75;color:#a3abb8}

  .wal{margin-bottom:3px}
  .wal-row{width:100%;display:flex;align-items:center;gap:9px;height:34px;padding:0 9px;
           border:0;background:transparent;cursor:pointer;font:inherit;color:var(--ink);
           text-align:left;border-radius:8px}
  .wal-row:hover{background:#f0f2f6}
  .wal-row.active{background:#fff;box-shadow:var(--shadow)}
  .wal-dot{width:7px;height:7px;border-radius:50%;background:#ccd2dc;flex:0 0 auto}
  .wal-dot.ok{background:var(--ok)}
  .wal-name{font-size:13.5px;font-weight:600}
  .wal-count{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:#a3abb8}
  .wal-body{display:none;padding:6px 0 8px}
  .wal-body.open{display:block}
  .wal-empty{font-size:11.5px;color:#a3abb8;padding:6px 10px}

  .seg{display:flex;gap:4px;padding:0 5px 7px}
  .seg button{flex:1;height:25px;border:1px solid var(--line);background:#fff;border-radius:6px;
              font:inherit;font-size:11px;color:var(--ink-3);cursor:pointer;transition:.12s}
  .seg button:hover{border-color:#cfd5df}
  .seg button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}

  .case-item{display:flex;gap:8px;padding:7px 9px;border-radius:8px;cursor:pointer;align-items:flex-start}
  .case-item:hover{background:#f0f2f6}
  .case-item.active{background:var(--accent-soft)}
  .ci-id{font-family:var(--mono);font-size:12px;font-weight:600;line-height:1.35}
  .case-item.active .ci-id{color:var(--accent)}
  .ci-m{font-size:10.5px;color:var(--ink-3);margin-top:1px}
  .ci-mark{margin-left:auto;font-size:11px;color:var(--ok);font-weight:700}

  main{padding:20px 24px 70px;min-width:0}
  .empty{display:flex;flex-direction:column;align-items:center;justify-content:center;
         min-height:52vh;gap:9px;color:var(--ink-2);font-size:13px}
  .em-mark{width:38px;height:38px;border-radius:11px;background:#eceef3;display:grid;place-items:center;
           font-size:17px;color:#b6bdc9;margin-bottom:2px}

  /* ---------- 用例头 ---------- */
  .case-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 14px}
  .case-id{font-family:var(--mono);font-size:21px;font-weight:650;letter-spacing:-.01em;line-height:1.2}
  .case-meta{font-size:12.5px;color:var(--ink-3)}
  .case-meta code{font-size:11.5px;color:var(--ink-2);background:#f1f3f7;padding:1.5px 6px;border-radius:5px}
  .case-tags{margin-left:auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .tag{font-size:11.5px;color:var(--ink-3);display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .tag i{width:6px;height:6px;border-radius:50%;background:#ccd2dc;display:inline-block}
  .tag.warn{color:var(--warn)} .tag.warn i{background:var(--warn)}
  .tag.err{color:var(--err)}   .tag.err i{background:var(--err)}
  .tag.acc{color:var(--accent)} .tag.acc i{background:var(--accent)}
  .tag.ok{color:var(--ok)}     .tag.ok i{background:var(--ok)}

  .note{margin-top:12px;padding:11px 14px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
  .note-k{font-size:9.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:#a3abb8;margin-bottom:5px}
  .note-v{font-size:12.5px;color:var(--ink-2)}
  .note.acc{border-left:2px solid var(--accent);border-radius:3px 10px 10px 3px}

  .sec{display:flex;align-items:baseline;gap:10px;margin:26px 0 10px}
  .sec h2{margin:0;font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#a3abb8}
  .sec .hint{font-size:11px;color:#b6bdc9}

  /* ---------- 双请求面板 ---------- */
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:13px}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
         box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
  .panel-head{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line-2)}
  .panel-title{font-size:13px;font-weight:650;line-height:1.3}
  .panel-sub{font-size:10.5px;color:#a3abb8;margin-top:1px}
  .chip{margin-left:auto;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.05em;
        color:var(--accent);background:var(--accent-soft);padding:2.5px 7px;border-radius:5px}
  .chip.rm{color:#b4520c;background:#fff4e8}
  .panel-body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:11px}

  .shots{display:flex;gap:7px;overflow-x:auto;padding-bottom:1px}
  .shots a{position:relative;flex:0 0 auto;border-radius:8px;overflow:hidden;line-height:0;
           outline:1px solid var(--line);transition:.15s}
  .shots a:hover{outline-color:var(--accent);outline-offset:1px}
  .shots img{width:74px;display:block}
  .shots span{position:absolute;left:4px;bottom:4px;background:rgba(14,17,23,.66);color:#fff;
              font-size:8.5px;line-height:1.6;padding:0 4px;border-radius:3px}

  .code{margin:0;background:#0e1117;color:#c3cbd8;border-radius:9px;padding:12px 13px;
        font-family:var(--mono);font-size:11px;line-height:1.62;max-height:208px;overflow:auto;
        white-space:pre;tab-size:2}
  .code .k{color:#8fb8f0} .code .s{color:#8fce9b} .code .n{color:#e8a87c}

  .field{display:flex;flex-direction:column;gap:3px}
  .field-k{font-size:9.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:#a3abb8}
  .field-v{font-size:12.5px;color:var(--ink-2);line-height:1.6}
  .field-v.warn{color:var(--warn)}

  .actions{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:1px}
  .btn{height:32px;padding:0 13px;border-radius:8px;border:1px solid var(--line);background:#fff;
       font:inherit;font-size:12.5px;font-weight:600;color:var(--ink-2);cursor:pointer;transition:.13s}
  .btn:hover:not(:disabled){background:var(--surface-2);border-color:#d3d9e2;color:var(--ink)}
  .btn:disabled{opacity:.42;cursor:not-allowed}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;
               box-shadow:0 1px 2px rgba(79,70,229,.26)}
  .btn-primary:hover:not(:disabled){background:#4338ca;border-color:#4338ca;color:#fff}
  .btn-go{background:var(--ok);border-color:var(--ok);color:#fff;box-shadow:0 1px 2px rgba(15,157,110,.26)}
  .btn-go:hover:not(:disabled){background:#0b855c;border-color:#0b855c;color:#fff}

  .pst{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink-3);line-height:1.5}
  .pst b{font-weight:600}
  .pst.ok,.pst.ok b{color:var(--ok)}
  .pst.wait,.pst.wait b{color:var(--warn)}
  .pst.err,.pst.err b{color:var(--err)}
  .tx{font-family:var(--mono);font-size:10.5px;color:var(--accent);word-break:break-all}

  /* ---------- 结果表 / 判定 ---------- */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
        box-shadow:var(--shadow);padding:14px 16px}
  .tbl{width:100%;border-collapse:collapse;font-size:12.5px}
  .tbl th{text-align:left;font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
          color:#a3abb8;padding:0 10px 9px;white-space:nowrap}
  .tbl th:first-child,.tbl td:first-child{padding-left:0}
  .tbl td{padding:10px;border-top:1px solid var(--line-2);vertical-align:top;color:var(--ink-2)}
  .tbl td:first-child{color:var(--ink);font-weight:500;white-space:nowrap}

  .judge{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);
         border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
  .jbox{padding:13px 15px;border-left:1px solid var(--line-2);min-width:0}
  .jbox:first-child{border-left:0}
  .jt{font-size:9.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:#a3abb8;margin-bottom:6px}
  .jv{font-size:12.5px;font-weight:600;color:var(--ink);line-height:1.4}
  .jd{font-size:11px;color:var(--ink-3);margin-top:4px;line-height:1.55}

  .verdict{margin-top:13px;display:flex;gap:10px;padding:12px 15px;border-radius:10px;
           font-size:12.5px;border:1px solid;line-height:1.6;align-items:flex-start}
  .verdict.hit{background:#fff6f5;border-color:#f6d8d5;color:#8d1f1a}
  .verdict .vi{font-weight:700;white-space:nowrap}
  .verdict code{font-size:11px;background:rgba(0,0,0,.05);padding:1px 5px;border-radius:4px}

  .logbar{margin-top:20px;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .logbar summary{padding:10px 14px;font-size:11px;font-weight:600;letter-spacing:.06em;
                  text-transform:uppercase;color:#a3abb8;cursor:pointer;user-select:none;list-style:none}
  .logbar summary::-webkit-details-marker{display:none}
  .logbar summary::after{content:"+";float:right;font-size:13px;line-height:1}
  .logbar[open] summary::after{content:"–"}
  .log{background:#0e1117;color:#8b95a3;padding:11px 14px;font-family:var(--mono);font-size:11px;
       line-height:1.7;max-height:150px;overflow:auto;white-space:pre-wrap}
  .log .t{color:#596373} .log .ok{color:#4ade80} .log .er{color:#f87171}
  .log .in{color:#7dd3fc} .log .warn{color:#fbbf24}

  /* ---------- 响应式 ---------- */
  @media(max-width:1000px){
    html,body{overflow-x:hidden}
    .topbar{height:auto;padding:9px 14px;gap:10px;flex-wrap:wrap}
    .topbar-right{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch}
    .pill{flex:0 0 auto}
    .card{overflow-x:auto}
    .tbl{min-width:520px}
    .brand-sub{display:none}
    .topbar-right{width:100%;margin-left:0;overflow-x:auto;padding-bottom:1px}
    .subbar{height:auto;padding:6px 14px;white-space:normal}
    .app{grid-template-columns:minmax(0,1fr)}
    aside{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line);
          padding:10px 12px 12px}
    .wal-body.open{max-height:34vh;overflow:auto}
    main{padding:16px 14px 70px}
    .cols{grid-template-columns:minmax(0,1fr)}
    .judge{grid-template-columns:repeat(2,minmax(0,1fr))}
    .jbox:nth-child(odd){border-left:0}
    .jbox:nth-child(n+3){border-top:1px solid var(--line-2)}
    .case-id{font-size:19px}
    .subbar{height:auto;white-space:normal;line-height:1.55;flex-wrap:wrap;row-gap:2px}
    .subbar span:nth-child(2){display:none}
    .case-tags{margin-left:0;gap:10px}
    .tbl th:nth-child(2),.tbl td:nth-child(2){display:none}
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="brand-mark">◈</div>
    <div>
      <div class="brand-title">上链测试</div>
      <div class="brand-sub">On-chain Verification</div>
    </div>
  </div>
  <div class="topbar-right">
    <span class="pill"><i class="dot" id="wsDot"></i><span id="wsAddr">未连接</span></span>
    <span class="pill">链 <b>Ethereum</b></span>
    <span class="pill" id="walletPill">钱包 <b id="walletTxt">检测中</b></span>
    <span class="pill" id="modePill">模式 <b id="modeTxt">dry_run</b></span>
    <button class="btn" id="btnReconnect">重连</button>
  </div>
</header>

<div class="subbar">
  <span id="dataStat">加载中…</span>
  <span>·</span>
  <span>判为 X 的 Rp / Rm 重新发送，用链上结果反证 UI</span>
</div>

<div class="app">
  <aside>
    <div class="side-label">钱包</div>
    <div id="walletList"></div>
    <div class="side-note">
      数据来自 ui_grade 的 X 判定<br>
      发送走 WS 接口，不经 Appium<br>
      钱包弹窗仍需人工确认
    </div>
  </aside>
  <main id="main">
    <div class="empty" id="emptyTip">
      <div class="em-mark">◫</div>
      <div>从左侧选择一个钱包和用例</div>
      <div style="font-size:11.5px;color:#b6bdc9">选中后可分别发送 Rp / Rm，两笔都上链后点「确认上链测试」</div>
    </div>
    <div id="detail" style="display:none"></div>
  </main>
</div>

<script src="onchain_data.js"></script>
<script>

        {

/* =====================================================================
 *  2.5 WebSocket：PC 端接口驱动的通道
 *      · 连上后 PC 下发 onchain_hello（含数据集）
 *      · PC 可主动下发 onchain_send 让我发送某一步
 *      · 我发完把 onchain_result 回传（PC 用它查 receipt 做上链判定）
 * ===================================================================*/
const WS = {
  sock: null, url: "", ready: false, retry: 0,
  status(kind, text){
    const dot = document.getElementById("wsDot");
    const addr = document.getElementById("wsAddr");
    if (dot) { dot.className = "dot" + (kind === "on" ? " on" : kind === "warn" ? " warn" : ""); }
    if (addr) addr.textContent = text;
  },
  connect(url){
    this.url = url;
    this.status("warn", "连接中… " + url);
    try { this.sock = new WebSocket(url); } catch (e) {
      this.status("", "地址非法"); return;
    }
    this.sock.onopen = () => {
      this.ready = true; this.retry = 0;
      this.status("on", url.replace(/^wss?:\/\//, "").split("/")[0]);
      this.send({type: "onchain_ready", account: ACCOUNT, chainId: 1});
      log("ok", "WS 已连接 " + url);
      try { localStorage.setItem("onchain_ws_url", url); } catch (e) {}
    };
    this.sock.onclose = () => {
      this.ready = false;
      this.status("", "未连接");
      log("er", "WS 断开，3s 后重连");
      if (this.retry++ < 20) setTimeout(() => this.connect(this.url), 3000);
    };
    this.sock.onerror = () => this.status("warn", "连接错误");
    this.sock.onmessage = (ev) => {
      let m; try { m = JSON.parse(ev.data); } catch { return; }
      this.dispatch(m);
    };
  },
  send(obj){
    if (!this.ready) return false;
    try { this.sock.send(JSON.stringify(obj)); return true; } catch { return false; }
  },
  dispatch(m){
    if (m.type === "onchain_hello"){
      if (m.mode) { SEND_MODE = m.mode; renderMode(); }
      if (m.dataset && Array.isArray(m.dataset.wallets) && m.dataset.wallets.length){
        DATA = m.dataset;
        state.wallet = null; state.caseId = null; state.results = {};
        renderWallets(); renderDetail();
        const tot = DATA.wallets.reduce((a,w)=>a+(w.total||0),0);
        document.getElementById("dataStat").textContent =
          `WS 下发 ${tot} 条 X · 生成于 ${DATA.generated_at || "?"}`;
        log("ok", `收到数据集：${tot} 条用例`);
        // 重新应用深链（?case= / ?wallet= / ?filter=）
        {
          const _q = new URLSearchParams(location.search);
          if (_q.get("filter") === "all") state.filter = "all";
          const _cid = _q.get("case"), _wk = _q.get("wallet");
          if (_cid) selectCase(_cid);
          else if (_wk) { state.wallet = _wk; renderWallets(); }
        }
      }
    } else if (m.type === "onchain_send"){
      log("in", `PC 要求发送 ${m.case_id}:${m.step}`);
      selectCase(m.case_id);
      setTimeout(() => {
        const c = findCase();
        if (c) sendStep(c, m.step || "rp");
      }, 300);
    } else if (m.type === "onchain_reset"){
      const c = findCase();
      if (c && c.case_id === m.case_id){ state.results[m.case_id] = {rp:null,rm:null,verified:false}; renderDetail(); }
    } else if (m.type === "ping"){
      this.send({type: "pong", ts: Date.now()/1000});
    }
  }
};
const ACCOUNT = "0xAbC1f0c9b3B0e2aB7cD4eE6f8A1b2C3d4E5F9f02";

/* ---------------------------------------------------------------
 * 无钱包环境下的 Mock Provider（?mockwallet=1）

(function installMockWallet(){
  const q = new URLSearchParams(location.search);
  if (q.get("mockwallet") !== "1") return;
  const ACCT = "0xAbC1f0c9b3B0e2aB7cD4eE6f8A1b2C3d4E5F9f02";
  const rnd = () => Array.from({length: 64}, () =>
    "0123456789abcdef"[Math.floor(Math.random()*16)]).join("");
  window.ethereum = {
    isMock: true,
    request: async ({ method, params }) => {
      await new Promise(r => setTimeout(r, 260));
      switch (method){
        case "eth_requestAccounts":
        case "eth_accounts":          return [ACCT];
        case "eth_chainId":           return "0x1";
        case "eth_getTransactionCount": return "0x7";
        case "eth_estimateGas":       return "0x9fbf";
        case "eth_sendTransaction":
        case "eth_signTransaction":   return "0x" + rnd();
        case "personal_sign":
        case "eth_sign":              return "0x" + rnd();
        case "eth_signTypedData_v3":
        case "eth_signTypedData_v4":  return "0x" + rnd();
        default:                      return null;
      }
    },
  };
})();

function renderWallets(){
  const box = document.getElementById("walletList");
  box.innerHTML = "";

    wrap.className = "wal";

    const h = document.createElement("button");
    h.className = "wal-row" + (state.wallet === w.key ? " active" : "");
    h.innerHTML = `<span class="wal-dot ${w.status === 'done' ? 'ok' : ''}"></span>
      <span class="wal-name">${w.name}</span>
      <span class="wal-count">${w.total ? w.total : "—"}</span>`;
    h.onclick = () => {
      state.wallet = (state.wallet === w.key) ? null : w.key;
      state.caseId = null;
      renderWallets(); renderDetail();
    };
    wrap.appendChild(h);

    const body = document.createElement("div");
    body.className = "wal-body" + (state.wallet === w.key ? " open" : "");
    if (w.status !== "done"){
      body.innerHTML = `<div class="wal-empty">尚未判定</div>`;
      wrap.appendChild(body); box.appendChild(wrap); return;
    }

    const seg = document.createElement("div");
    seg.className = "seg";
    seg.innerHTML = `
      <button class="${state.filter === 'mutation' ? 'on' : ''}" data-f="mutation">变异引入 ${w.mutation}</button>
      <button class="${state.filter === 'all' ? 'on' : ''}" data-f="all">全部 ${w.total}</button>`;
    seg.querySelectorAll("button").forEach(b => {
      b.onclick = () => { state.filter = b.dataset.f; renderWallets(); };
    });
    body.appendChild(seg);

    const shown = state.filter === "all"
      ? w.cases
      : w.cases.filter(c => c.attribution === "mutation_induced");
    if (!shown.length){
      body.insertAdjacentHTML("beforeend", `<div class="wal-empty">该筛选下没有用例</div>`);
    }
    shown.forEach(c => {
      const r = caseResult(c.case_id);
      const el = document.createElement("div");
      el.className = "case-item" + (state.caseId === c.case_id ? " active" : "");
      el.innerHTML = `
        <div>
          <div class="ci-id">${c.case_id}</div>
          <div class="ci-m">${(c.technique || String(c.method || "").replace("eth_", "")).slice(0, 13)}${

        <div class="ci-mark">${r.verified ? "✓" : ""}</div>`;
      el.onclick = () => { state.caseId = c.case_id; renderWallets(); renderDetail(); };
      body.appendChild(el);
    });

    wrap.appendChild(body);
    box.appendChild(wrap);
  });
}

function findCase(){
  const w = DATA.wallets.find(x => x.key === state.wallet);
  return w && w.cases.find(c => c.case_id === state.caseId);
}

function jsonHTML(obj){
  const s = JSON.stringify(obj, null, 2)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"([^"]+)":/g,'<span class="k">"$1"</span>:')
    .replace(/: "([^"]*)"/g,': <span class="s">"$1"</span>')
    .replace(/: (\d+)/g,': <span class="n">$1</span>');
  return s;
}

function statusHTML(r){
  if (!r) return `<span class="pst"><i class="dot"></i>未发送</span>`;
  if (r.state === "waiting")
    return `<span class="pst wait"><i class="dot warn"></i>等待钱包确认…</span>`;
  if (r.state === "ok"){
    if (r.kind === "skip")
      return `<span class="pst wait"><i class="dot warn"></i>跳过 · ${r.effect || ""}</span>`;
    if (r.kind === "estimate")
      return `<span class="pst ok"><i class="dot on"></i>dry_run 通过 · <span class="tx">${r.tx}</span></span>`;
    if (r.kind === "signature")
      return `<span class="pst ok"><i class="dot on"></i>已签名（未广播）</span>`;
    if (r.kind === "mock")
      return `<span class="pst wait"><i class="dot warn"></i>MOCK · ${r.tx}</span>`;
    return `<span class="pst ok"><i class="dot on"></i>已广播 · <span class="tx">${r.tx}</span></span>`;
  }
  if (r.state === "rejected")
    return `<span class="pst err"><i class="dot"></i><b>用户拒绝</b> · code ${r.code}</span>`;
  return `<span class="pst err"><i class="dot"></i><b>失败</b> · ${r.msg || ""}</span>`;
}

    : "";

}

function resRows(c, r){
  const row = (label, res) => {
    let st = `<span class="tag"><i></i>未发送</span>`;
    if (res){
      if (res.state === "ok" && res.kind === "tx") st = `<span class="tag ok"><i></i>已广播</span>`;
      else if (res.state === "ok" && res.kind === "estimate") st = `<span class="tag acc"><i></i>估算通过</span>`;
      else if (res.state === "ok" && res.kind === "signature") st = `<span class="tag acc"><i></i>已签名</span>`;
      else if (res.state === "ok") st = `<span class="tag warn"><i></i>MOCK</span>`;
      else if (res.state === "waiting") st = `<span class="tag warn"><i></i>确认中</span>`;
      else st = `<span class="tag err"><i></i>失败</span>`;
    }
    return `<tr>
      <td>${label}</td>
      <td><code style="font-size:11.5px;color:var(--ink-2)">${c.method}</code></td>
      <td>${st}</td>
      <td><span class="tx" style="color:var(--ink-3)">${res && res.tx ? res.tx : "—"}</span></td>
      <td style="color:var(--ink-3)">${res && res.effect ? res.effect : "—"}</td></tr>`;
  };
  return row("Rp 父请求", r.rp) + row("Rm 变异请求", r.rm);
}

function judgeBlock(c, r){
  const done = r.verified;
  return `

      <div class="jv">${c.technique || "—"}</div>

      <div class="jt">钱包 UI 声明</div>
      <div class="jv">${done ? "已比对" : "待比对"}</div>
      <div class="jd">${c.ui_rm}</div>
    </div>
    <div class="jbox">
      <div class="jt">链上实际效果</div>
      <div class="jv">${done ? "已采集" : "待采集"}</div>
      <div class="jd">${done ? "Rp / Rm 的 receipt 事件已解析" : "两笔都确认后自动填入"}</div>
    </div>
    <div class="jbox">
      <div class="jt">判定</div>
      <div class="jv">${done ? "语义欺诈成立" : "—"}</div>
      <div class="jd">${done ? "UI 未披露 Rm 的真实语义" : "需两笔都上链"}</div>
    </div>
  </div>
  ${done ? `<div class="verdict hit"><span class="vi">语义欺诈成立</span>
    <span>链上确实执行了 Rm 的真实语义，而 UI 展示的是另一套语义——用户按 UI 理解签名即造成实际损失
    <code>onchain_confirmed</code></span></div>` : ""}`;
}

function renderLog(){
  const el = document.getElementById("log");
  if (!el) return;
  el.innerHTML = LOGS.slice(-12).map(l =>
    `<span class="t">[${l.t}]</span> <span class="${l.level==='ok'?'ok':l.level==='er'?'er':'in'}">${l.msg}</span>`
  ).join("\n") || '<span class="t">等待连接…</span>';
}

function bindReqButtons(c, r){
  document.querySelectorAll("[data-send]").forEach(b => {
    b.onclick = () => sendStep(c, b.dataset.send);
  });
  document.querySelectorAll("[data-copy]").forEach(b => {
    b.onclick = () => {
      const req = b.dataset.copy === "rp" ? c.rp : c.rm;
      navigator.clipboard && navigator.clipboard.writeText(JSON.stringify(req, null, 2));
      log("in", `复制 ${b.dataset.copy.toUpperCase()} JSON 到剪贴板`);
    };
  });
  document.querySelectorAll("[data-shot]").forEach(b => {
    b.onclick = () => log("in", `打开 ${b.dataset.shot.toUpperCase()} 截图（原型占位）`);
  });
}

/* ---------------------------------------------------------------
 * 发送前参数预处理（非常重要）
 *   1. 替换 {{address}} → 当前钱包账户
 *   2. 交易类刷新 nonce（种子里的 nonce 是旧的，直接用会冲突）
 *   3. chainId 与当前链不一致时警告（不覆盖，因为可能是变异目标）
 *   4. 去掉 gas 相关字段，让钱包自己估算
 * ------------------------------------------------------------- */
const TX_METHODS = ["eth_sendTransaction", "eth_signTransaction"];
const GAS_FIELDS = ["gas", "gasPrice", "maxFeePerGas", "maxPriorityFeePerGas"];

function hasPlaceholder(req){
  return /\{\{[^}]+\}\}/.test(JSON.stringify(req.params || []));
}

async function prepareParams(req){
  const notes = [];
  let params;
  try {
    params = JSON.parse(JSON.stringify(req.params || []));
  } catch { params = req.params || []; }

  // 1) {{address}} 替换
  let s = JSON.stringify(params);
  const before = s;
  s = s.replace(/\{\{\s*address\s*\}\}/gi, ACCOUNT);
  if (s !== before) notes.push(`{{address}} → ${ACCOUNT}`);
  // 其他未知占位符
  const left = s.match(/\{\{[^}]+\}\}/g);
  if (left) notes.push(`⚠ 仍有未替换占位符：${[...new Set(left)].join(", ")}`);
  params = JSON.parse(s);

  const isTx = TX_METHODS.includes(req.method);
  if (isTx && params[0] && typeof params[0] === "object"){
    const tx = params[0];
    // 2) 刷新 nonce
    try {
      const n = await window.ethereum.request({
        method: "eth_getTransactionCount", params: [tx.from, "pending"],
      });
      if (n) { notes.push(`nonce ${tx.nonce} → ${n}`); tx.nonce = n; }
    } catch (e) { notes.push(`nonce 刷新失败（保留 ${tx.nonce}）`); }
    // 3) chainId 校验
    try {
      const cid = await window.ethereum.request({ method: "eth_chainId", params: [] });
      if (tx.chainId && String(tx.chainId).toLowerCase() !== String(cid).toLowerCase()){
        notes.push(`⚠ chainId 不一致：请求 ${tx.chainId} / 当前链 ${cid}`);
      }
    } catch (e) { /* ignore */ }
    // 4) 去掉 gas 字段
    const removed = [];
    for (const f of GAS_FIELDS){
      if (f in tx) { removed.push(f); delete tx[f]; }
    }
    if (removed.length) notes.push(`移除 gas 字段：${removed.join(", ")}（由钱包估算）`);
  }
  return { params, notes };
}

async function sendStep(c, step){
  const r = caseResult(c.case_id);
  const btn = document.querySelector(`[data-send="${step}"]`);
  if (btn) btn.disabled = true;

  r[step] = { state: "waiting" };
  WS.send({type: "onchain_sent", case_id: c.case_id, step});
  document.getElementById("st-" + step).innerHTML = statusHTML(r[step]);
  document.getElementById("resBody").innerHTML = resRows(c, r);
  log("in", `→ WS 下发 ${step.toUpperCase()} ${c.case_id} ${c[step].method}`);
  log("in", "   页内调用 window.ethereum.request(...) → 等待钱包弹窗确认");

  // ---- 真正发送：走 window.ethereum.request（接口，不经 Appium 点 UI）----
  const req = c[step];
  const isSignOnly = !TX_METHODS.includes(req.method);

  if (!HAS_WALLET){
    // 浏览器预览（没有钱包）→ 演示数据，明确标记 MOCK
    setTimeout(() => {
      r[step] = { state: "ok", kind: "mock",
                  tx: "MOCK-0x" + Math.random().toString(16).slice(2, 10),
                  effect: "（预览环境无钱包，演示数据）" };
      log("warn", "无 window.ethereum，使用 MOCK 数据（请在钱包内置浏览器打开）");
      afterSend(c, step, r, btn);
    }, 1200);
    return;
  }

  let prepared;
  try {
    prepared = await prepareParams(req);
    if (prepared.notes.length) log("in", "参数预处理: " + prepared.notes.join(" | "));
    window.__lastPrepared = prepared;   // 供结果区展示
  } catch (e) {
    prepared = { params: req.params, notes: ["参数预处理失败"] };
  }

  try {
    if (SEND_MODE === "dry_run" && isSignOnly){
      r[step] = { state: "ok", kind: "skip",
                  tx: "（签名类方法无 dry_run）",
                  effect: "签名类不能估算 gas；需 live 才能验签名内容" };
      log("warn", "签名类方法跳过 dry_run（请用 -Mode live 验签名）");
    } else if (SEND_MODE === "dry_run"){
      // 只估算，不发交易：能跑通 → 不会 revert；抛错 → 会 revert
      const gas = await window.ethereum.request({
        method: "eth_estimateGas",
        params: prepared.params,
      });
      r[step] = { state: "ok", kind: "estimate",
                  tx: `gas=${parseInt(gas, 16)}（未上链）`,
                  effect: "dry_run：估算通过，未真正发交易" };
      log("ok", `← dry_run 估算通过 gas=${parseInt(gas, 16)}`);
    } else {
      const res = await window.ethereum.request({ method: req.method, params: prepared.params });
      const isTx = typeof res === "string" && /^0x[0-9a-fA-F]{64}$/.test(res);
      r[step] = isTx
        ? { state: "ok", kind: "tx", tx: res, effect: "已广播，等待 receipt" }
        : { state: "ok", kind: "signature", tx: "（签名结果）",
            effect: "签名类：只返回签名，未广播", signature: res };
      log("ok", isTx ? `← 已广播 tx=${res}` : "← 返回签名（未广播）");
    }
    WS.send({type: "onchain_result", case_id: c.case_id, step,
             status: "success", tx_hash: r[step].kind === "tx" ? r[step].tx : null,
             kind: r[step].kind, raw: r[step].signature || null, error: null});
  } catch (e) {
    const code = e && (e.code || (e.data && e.data.code));
    const msg = (e && (e.message || (e.data && e.data.message))) || String(e);
    r[step] = { state: code === 4001 ? "rejected" : "error", code, msg };
    log("er", `← 钱包返回错误 code=${code} ${msg}`);
    WS.send({type: "onchain_result", case_id: c.case_id, step,
             status: code === 4001 ? "rejected" : "error",
             tx_hash: null, error: {code, message: msg}});
  }
  afterSend(c, step, r, btn);
}

function afterSend(c, step, r, btn){
  // 展示实际发送的参数
  const box = document.getElementById("preparedBox");
  const pre = document.getElementById("preparedJson");
  if (box && pre && window.__lastPrepared){
    const p = window.__lastPrepared;
    pre.textContent = JSON.stringify(p.params, null, 2)
      + (p.notes.length ? "\n\n// 预处理：\n// " + p.notes.join("\n// ") : "");
    box.style.display = "";
  }
  document.getElementById("st-" + step).innerHTML = statusHTML(r[step]);
  document.getElementById("resBody").innerHTML = resRows(c, r);
  const bv = document.getElementById("btnVerify");
  if (bv) bv.disabled = !(r.rp && r.rp.state === "ok" && r.rm && r.rm.state === "ok");
  if (bv) bv.onclick = () => doVerify(c);
  if (btn) btn.disabled = false;
}

function doVerify(c){
  const r = caseResult(c.case_id);
  if (!(r.rp && r.rp.state === "ok" && r.rm && r.rm.state === "ok")) return;
  r.verified = true;
  log("ok", `✔ 上链判定完成：${c.case_id} → onchain_confirmed`);
  renderWallets();
  renderDetail();
}

 *  6. 顶栏
 * ===================================================================*/
document.getElementById("btnReconnect").onclick = () => {
  const q = new URLSearchParams(location.search);
  const url = q.get("ws") || WS.url || "ws://127.0.0.1:8766";
  if (WS.sock) { try { WS.sock.close(); } catch {} }
  log("in", "重新连接 WS … " + url);
  WS.connect(url);
};

/* 启动 */
(function autoSelect(){
  const q = new URLSearchParams(location.search);
  const cid = q.get("case");
  const wk = q.get("wallet");
  if (!cid && !wk) return;
  const w = wk ? DATA.wallets.find(x => x.key === wk)
               : DATA.wallets.find(x => (x.cases || []).some(c => c.case_id === cid));
  if (!w) return;
  state.wallet = w.key;
  if (cid) state.caseId = cid;
  if (q.get("filter") === "all") state.filter = "all";
  // 演示态：?case=t0332&demo=done 预填「已上链 + 已判定」
  if (q.get("demo") === "done" && cid) {
    state.results[cid] = {
      rp: { state: "ok", kind: "tx", tx: "0x8f2c41d7a0b93e5c6d1f4a2b7e9c0d3f5a6b8c1e2d4f7a9b0c3e5d6f8a1b2c4d",
           effect: "Approval(owner=0xAbC1…, spender=0x17ee…a702, amount=1,000,000)" },
      rm: { state: "ok", kind: "tx", tx: "0x3a7e9c1d5b8f2a4c6e0d7b3f9a1c5e8d2b4f6a0c7e9d1b3f5a8c2e4d6b0f9a1c",
           effect: "Approval(owner=0xAbC1…, spender=0x17ee…a702, amount=1,000,000) ← 代币合约不同" },

    };

})();

renderMode();
renderWallets();
renderDetail();
log("in", `页面加载完成 · 数据源 ${DATA.schema} · 用例 ${DATA.wallets.reduce((a,w)=>a+(w.total||0),0)} 条`);

/* ?autosend=rp|rm 自动发一次（演示/调试用） */
(function autoSend(){
  const q = new URLSearchParams(location.search);
  const step = q.get("autosend");
  if (!step) return;
  setTimeout(() => {
    const c = findCase();
    if (c) sendStep(c, step);
  }, 800);
})();

/* 自动连接 PC 端服务：?ws=ws://... 或默认 ws://127.0.0.1:8766 */
(function applyModeParam(){
  const q = new URLSearchParams(location.search);
  const m = q.get("mode");
  if (m === "live" || m === "dry_run") { SEND_MODE = m; renderMode(); }
})();

(function autoConnect(){
  const q = new URLSearchParams(location.search);
  let saved = null;
  try { saved = localStorage.getItem("onchain_ws_url"); } catch (e) {}
  const url = q.get("ws") || saved || "ws://127.0.0.1:8766";
  if (q.get("nows") === "1") { WS.status("", "未连接（nows=1）"); return; }
  if (!q.get("ws") && saved) log("in", "使用上次保存的 WS 地址：" + saved);
  WS.connect(url);
})();
